<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyframes Animation Example</title>
    <style>
        /* Keyframes animation */
        @keyframes identifier {
            0% {
                top: 0;
                left: 0;
            }

            30% {
                top: 50px;
            }

            68%,
            72% {
                left: 50px;
            }

            100% {
                top: 100px;
                left: 100%;
            }
        }

        /* Style for the animated element */
        .box {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: blue;
            animation: identifier 3s ease-in-out infinite;
        }

        /* Container to limit the animation space */
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>

</html>
